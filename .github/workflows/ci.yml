name: CI Verification & Build Checks

on:
  push:
    branches:
      - 'release/**'
      - 'release-*'
      - 'dev'
      - 'master'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE_DEPRECATION_WARNING: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'
  RUST_BACKTRACE: '1'

jobs:
  preflight-check:
    name: Preflight & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ubuntu-preflight-v1

      - name: Install Linux system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Run Full Preflight Verification
        run: node scripts/preflight.js

  matrix-build:
    name: Build & Verify (${{ matrix.name }})
    needs: preflight-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux x86_64'
          - platform: 'windows-latest'
            name: 'Windows x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.platform }}-ci-v1

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles deb,appimage --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles dmg,app --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          bun run tauri build --bundles nsis --verbose *>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD LOG TAIL ==="
            Get-Content tauri-build.log -Tail 120
            exit 1
          }

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
