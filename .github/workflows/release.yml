name: Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE_DEPRECATION_WARNING: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'
  RUST_BACKTRACE: '1'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read Release Notes and Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = '${{ steps.get-tag.outputs.tag }}';
            
            let releaseBody = '';
            const notesFile = path.join(process.env.GITHUB_WORKSPACE, `docs/RELEASE_NOTES_${tagName}.md`);
            if (fs.existsSync(notesFile)) {
              releaseBody = fs.readFileSync(notesFile, 'utf8');
            } else {
              releaseBody = `## 🚀 BeReal Studio ${tagName}\n\nOne-click desktop application to browse, composite, and recap BeReal GDPR archives.`;
            }

            let releaseId;
            // Check if release already exists
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              if (existing.data) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  name: `BeReal Studio ${tagName}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false
                });
                releaseId = existing.data.id;
              }
            } catch (e) {
              // Not found, proceed to create
            }

            if (!releaseId) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `BeReal Studio ${tagName}`,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
              releaseId = data.id;
            }

            // Clean up any unwanted build script or junk assets if present
            try {
              const assets = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100
              });
              for (const asset of assets.data) {
                if (/^build[-_]script/i.test(asset.name) || /^bereal_studio\.exe$/i.test(asset.name)) {
                  console.log(`Deleting unwanted asset: ${asset.name} (${asset.id})`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                }
              }
            } catch (e) {
              console.log('Asset cleanup notice:', e.message);
            }

            return releaseId;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux x86_64'
          - platform: 'windows-latest'
            name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.platform }}-v4-clean

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles deb,appimage --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles dmg,app --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          bun run tauri build --bundles nsis --verbose *>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD LOG TAIL ==="
            Get-Content tauri-build.log -Tail 120
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: |
            tauri-build.log
            cargo-build.log
          if-no-files-found: ignore

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          
          # Find and copy installer packages strictly from Tauri's bundle output directory
          echo "=== Scanning for release bundle packages in src-tauri/target/release/bundle/ ==="
          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle/ -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.appimage" -o -name "*.msi" -o -name "*.exe" \) | while read -r f; do
              echo "Found bundle: $f"
              cp "$f" "$GITHUB_WORKSPACE/release-artifacts/"
            done
          fi

          # Check for compiled standalone binaries strictly at target/release root
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -f "src-tauri/target/release/bereal-studio.exe" ]; then
              echo "Found standalone Windows binary: bereal-studio.exe"
              cp "src-tauri/target/release/bereal-studio.exe" "$GITHUB_WORKSPACE/release-artifacts/"
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            if [ -f "src-tauri/target/release/bereal-studio" ]; then
              echo "Found standalone Linux binary: bereal-studio"
              cp "src-tauri/target/release/bereal-studio" "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64"
              chmod +x "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64"
              tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64.tar.gz" -C "$GITHUB_WORKSPACE/release-artifacts" "BeReal-Studio-Linux-x86_64"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if [ -f "src-tauri/target/release/bereal-studio" ]; then
              echo "Found standalone macOS binary: bereal-studio"
              cp "src-tauri/target/release/bereal-studio" "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64"
              chmod +x "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64"
              tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64.tar.gz" -C "$GITHUB_WORKSPACE/release-artifacts" "BeReal-Studio-macOS-arm64"
            fi
          fi

          # Package macOS .app directory into tarball if present
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS.app.tar.gz" *.app 2>/dev/null || true
            cd -
          fi

          echo "=== Final files in release-artifacts/ ==="
          ls -la "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload Release Binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag_name }}"
          [ -z "$TAG" ] || [ "$TAG" = "true" ] && TAG="v2.0.0"
          echo "Uploading release artifacts for tag $TAG..."
          if [ -d "$GITHUB_WORKSPACE/release-artifacts" ]; then
            cd "$GITHUB_WORKSPACE/release-artifacts"
            for f in *; do
              if [ -f "$f" ]; then
                echo "Uploading $f..."
                gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
              fi
            done
          fi

  cleanup-release-assets:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Purge Non-Release and Intermediate Build Binaries
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            if (!releaseId) {
              console.log('No release_id provided, skipping asset cleanup.');
              return;
            }
            try {
              const assets = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100
              });
              for (const asset of assets.data) {
                if (/^build[-_]script/i.test(asset.name) || /^bereal_studio\.exe$/i.test(asset.name)) {
                  console.log(`Purging unwanted asset: ${asset.name} (${asset.id})`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                }
              }
              console.log('Asset cleanup completed successfully.');
            } catch (e) {
              console.log('Error during asset cleanup:', e.message);
            }

