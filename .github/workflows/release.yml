name: Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE_DEPRECATION_WARNING: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read Release Notes and Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = '${{ steps.get-tag.outputs.tag }}';
            
            let releaseBody = '';
            const notesFile = path.join(process.env.GITHUB_WORKSPACE, `docs/RELEASE_NOTES_${tagName}.md`);
            if (fs.existsSync(notesFile)) {
              releaseBody = fs.readFileSync(notesFile, 'utf8');
            } else {
              releaseBody = `## 🚀 BeReal Studio ${tagName}\n\nOne-click desktop application to browse, composite, and recap BeReal GDPR archives.`;
            }

            // Check if release already exists
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              if (existing.data) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  name: `BeReal Studio ${tagName}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false
                });
                return existing.data.id;
              }
            } catch (e) {
              // Not found, proceed to create
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `BeReal Studio ${tagName}`,
              body: releaseBody,
              draft: false,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux x86_64'
          - platform: 'windows-latest'
            name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.platform }}-v2

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application (Unix)
        if: runner.os != 'Windows'
        run: bun run tauri build --verbose 2>&1 | tee tauri-build.log

      - name: Build Tauri Desktop Application (Windows)
        if: runner.os == 'Windows'
        run: bun run tauri build --verbose *>&1 | Tee-Object -FilePath tauri-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Package macOS .app into tarball
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            tar -czf "BeReal-Studio-macOS-app.tar.gz" *.app 2>/dev/null || true
            cd -
          fi

      - name: List Generated Bundle Files
        shell: bash
        run: |
          echo "=== All files in src-tauri/target/release/bundle ==="
          find src-tauri/target/release/bundle/ -type f || true

      - name: Upload Release Binaries
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tagName = '${{ needs.create-release.outputs.tag_name }}' || 'v2.0.0';
            const resolvedTag = (tagName && tagName !== 'true') ? tagName : 'v2.0.0';

            function findFiles(dir, exts) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              const list = fs.readdirSync(dir, { withFileTypes: true });
              for (const file of list) {
                const fullPath = path.join(dir, file.name);
                if (file.isDirectory()) {
                  results = results.concat(findFiles(fullPath, exts));
                } else if (exts.some(ext => file.name.toLowerCase().endsWith(ext.toLowerCase()))) {
                  results.push(fullPath);
                }
              }
              return results;
            }

            const bundleDir = path.join(process.env.GITHUB_WORKSPACE, 'src-tauri', 'target', 'release', 'bundle');
            const exts = ['.dmg', '.deb', '.appimage', '.exe', '.msi', '.tar.gz', '.zip'];
            const files = findFiles(bundleDir, exts);

            console.log(`Found ${files.length} bundle binaries in ${bundleDir}:`);
            files.forEach(f => console.log(' - ' + f));

            if (files.length === 0) {
              console.log('No matching bundle files found to upload.');
              return;
            }

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: resolvedTag
            });

            for (const filePath of files) {
              const fileName = path.basename(filePath);
              const fileData = fs.readFileSync(filePath);

              const existing = release.data.assets.find(a => a.name === fileName);
              if (existing) {
                console.log(`Removing old asset ${fileName} (${existing.id})...`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id
                });
              }

              console.log(`Uploading ${fileName} (${(fileData.length / 1024 / 1024).toFixed(2)} MB)...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: fileName,
                data: fileData,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fileData.length
                }
              });
              console.log(`Uploaded: ${fileName}`);
            }
