name: Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE_DEPRECATION_WARNING: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'
  RUST_BACKTRACE: '1'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read Release Notes and Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = '${{ steps.get-tag.outputs.tag }}';
            
            let releaseBody = '';
            const notesFile = path.join(process.env.GITHUB_WORKSPACE, `docs/RELEASE_NOTES_${tagName}.md`);
            if (fs.existsSync(notesFile)) {
              releaseBody = fs.readFileSync(notesFile, 'utf8');
            } else {
              releaseBody = `## 🚀 BeReal Studio ${tagName}\n\nOne-click desktop application to browse, composite, and recap BeReal GDPR archives.`;
            }

            // Check if release already exists
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              if (existing.data) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  name: `BeReal Studio ${tagName}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false
                });
                return existing.data.id;
              }
            } catch (e) {
              // Not found, proceed to create
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `BeReal Studio ${tagName}`,
              body: releaseBody,
              draft: false,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux x86_64'
          - platform: 'windows-latest'
            name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.platform }}-v4-clean

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles deb,appimage --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          bun run tauri build --bundles dmg,app --verbose 2>&1 | tee tauri-build.log || (echo "=== BUILD LOG TAIL ===" && tail -n 120 tauri-build.log && exit 1)

      - name: Build Tauri Desktop Application (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          bun run tauri build --bundles nsis,msi --verbose *>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD LOG TAIL ==="
            Get-Content tauri-build.log -Tail 120
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: |
            tauri-build.log
            cargo-build.log
          if-no-files-found: ignore

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          
          # Find and copy all installer packages
          echo "=== Scanning for release files in src-tauri/target/ ==="
          find src-tauri/target/ -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.appimage" -o -name "*.msi" -o -name "*.exe" \) | while read -r f; do
            echo "Found bundle: $f"
            cp "$f" "$GITHUB_WORKSPACE/release-artifacts/"
          done

          # Check for compiled standalone binaries
          for bin in "src-tauri/target/release/bereal-studio" "src-tauri/target/release/BeReal Studio" "src-tauri/target/release/bereal_studio"; do
            if [ -f "$bin" ]; then
              echo "Found standalone binary: $bin"
              if [ "${{ runner.os }}" = "Linux" ]; then
                cp "$bin" "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64"
                chmod +x "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64"
                tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-Linux-x86_64.tar.gz" -C "$GITHUB_WORKSPACE/release-artifacts" "BeReal-Studio-Linux-x86_64"
              elif [ "${{ runner.os }}" = "macOS" ]; then
                cp "$bin" "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64"
                chmod +x "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64"
                tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS-arm64.tar.gz" -C "$GITHUB_WORKSPACE/release-artifacts" "BeReal-Studio-macOS-arm64"
              fi
            fi
          done

          # Package macOS .app directory into tarball if present
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            tar -czf "$GITHUB_WORKSPACE/release-artifacts/BeReal-Studio-macOS.app.tar.gz" *.app 2>/dev/null || true
            cd -
          fi

          echo "=== Final files in release-artifacts/ ==="
          ls -la "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload Release Binaries
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tagName = '${{ needs.create-release.outputs.tag_name }}' || 'v2.0.0';
            const resolvedTag = (tagName && tagName !== 'true') ? tagName : 'v2.0.0';

            const artifactDir = path.join(process.env.GITHUB_WORKSPACE, 'release-artifacts');
            if (!fs.existsSync(artifactDir)) {
              console.log('Artifact directory does not exist.');
              return;
            }

            const files = fs.readdirSync(artifactDir)
              .map(f => path.join(artifactDir, f))
              .filter(f => fs.statSync(f).isFile());

            console.log(`Found ${files.length} release artifacts to upload:`);
            files.forEach(f => console.log(' - ' + path.basename(f) + ' (' + (fs.statSync(f).size / 1024 / 1024).toFixed(2) + ' MB)'));

            if (files.length === 0) {
              console.log('No files found to upload.');
              return;
            }

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: resolvedTag
            });

            for (const filePath of files) {
              const fileName = path.basename(filePath);
              const fileData = fs.readFileSync(filePath);

              try {
                const freshRelease = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: resolvedTag
                });

                const existing = freshRelease.data.assets.find(a => a.name === fileName);
                if (existing) {
                  console.log(`Removing old asset ${fileName} (${existing.id})...`);
                  try {
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: existing.id
                    });
                  } catch (e) {
                    console.log(`Note on delete: ${e.message}`);
                  }
                }

                console.log(`Uploading ${fileName} (${(fileData.length / 1024 / 1024).toFixed(2)} MB)...`);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id,
                  name: fileName,
                  data: fileData,
                  headers: {
                    'content-type': 'application/octet-stream',
                    'content-length': fileData.length
                  }
                });
                console.log(`Successfully uploaded: ${fileName}`);
              } catch (err) {
                console.warn(`Warning uploading ${fileName}: ${err.message}`);
              }
            }
