name: Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build and Upload Artifacts via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BeReal Studio ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 BeReal Studio ${{ github.ref_name }} — The Memories Explorer Release

            BeReal Studio v2.0.0 introduces the **Native BeReal Memories & Calendar Explorer**, bringing the authentic mobile BeReal browsing and post exploration experience directly to your desktop.

            ### 📦 One-Click Platform Installers
            - 🍏 **macOS**: `BeReal Studio_${{ github.ref_name }}_universal.dmg` (Universal binary for M1/M2/M3/M4 & Intel)
            - 🪟 **Windows**: `BeReal Studio_${{ github.ref_name }}_x64-setup.exe` (NSIS Installer) and `_en-US.msi`
            - 🐧 **Linux**: `BeReal Studio_${{ github.ref_name }}_amd64.AppImage` (Universal) and `.deb`

            ### 🌟 Key Highlights
            - **Native Memories & Calendar Explorer**: Fluid mobile dark UI, segmented toggle `[ Memories | Calendar ]`, and monthly calendar matrix.
            - **Continuous Vertical Infinite-Scroll Feed**: Seamless whole-archive scrolling with auto-scroll to tapped post and dynamic top date tracking.
            - **Interactive Dual-Camera Frame & Movable PIP**: Click-to-swap camera perspectives and drag-and-drop selfie PIP to any corner.
            - **Multi-Dimensional Filter Bar**: Live instant search and dropdown filters by Year, Month, City, and Country.
            - **Contextual Export Menu**: 1-click PIP, Side-by-Side, single camera exports with full metadata.
            - **Blazing Fast Engine**: Rayon multi-core processing parses and geocodes 1,000+ posts in under 10ms.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
