name: Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_NODE_DEPRECATION_WARNING: 'false'
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="v2.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read Release Notes and Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = '${{ steps.get-tag.outputs.tag }}';
            
            let releaseBody = '';
            const notesFile = path.join(process.env.GITHUB_WORKSPACE, `docs/RELEASE_NOTES_${tagName}.md`);
            if (fs.existsSync(notesFile)) {
              releaseBody = fs.readFileSync(notesFile, 'utf8');
            } else {
              releaseBody = `## 🚀 BeReal Studio ${tagName}\n\nOne-click desktop application to browse, composite, and recap BeReal GDPR archives.`;
            }

            // Check if release already exists
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });
              if (existing.data) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  name: `BeReal Studio ${tagName}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false
                });
                return existing.data.id;
              }
            } catch (e) {
              // Not found, proceed to create
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `BeReal Studio ${tagName}`,
              body: releaseBody,
              draft: false,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux x86_64'
          - platform: 'windows-latest'
            name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.platform }}-v2

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfuse2 \
            libglib2.0-dev \
            squashfs-tools \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application (Unix)
        if: runner.os != 'Windows'
        run: bun run tauri build --verbose 2>&1 | tee tauri-build.log

      - name: Build Tauri Desktop Application (Windows)
        if: runner.os == 'Windows'
        run: bun run tauri build --verbose *>&1 | Tee-Object -FilePath tauri-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: List Generated Bundle Files
        shell: bash
        run: |
          echo "=== Generated Bundle Artifacts ==="
          find src-tauri/target/ -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.appimage" -o -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -print || true

      - name: Upload Release Binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag_name || 'v2.0.0' }}"
          echo "Uploading desktop binaries to release $TAG..."
          find src-tauri/target/ -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.appimage" -o -name "*.exe" -o -name "*.msi" \) -exec gh release upload "$TAG" {} --clobber +
