[package]
name = "bereal-studio"
version = "1.9.0"
description = "BeReal Studio — process and recap your BeReal GDPR data exports"
authors = ["BeReal Studio"]
edition = "2021"

[lib]
name = "bereal_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
imageproc = "0.25"
ab_glyph = "0.2"
img-parts = "0.3"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallelism
rayon = "1"

# File system
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
filetime = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP (geocoding & downloads)
reqwest = { version = "0.12", features = ["json"] }
ureq = { version = "2.10", features = ["json"] }

# Audio (Recapper)
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "wav"] }

# Font enumeration
font-kit = "0.14"

# Misc
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
